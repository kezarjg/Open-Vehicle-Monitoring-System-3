name: Host tests

# Runs the native (host) unit tests for vehicle decode logic. These compile the
# real vehicle module .cpp against a mock OVMS framework (vehicle/OVMS.V3/test/host)
# and run on the CI runner itself — no ESP-IDF, no xtensa toolchain, no hardware.
# Fast (seconds) and complements the firmware compile-check in build.yml.
#
# Every components/vehicle_*/tests/ directory with a Makefile is discovered and
# run automatically, so adding a suite for a new vehicle needs no change here.

on:
  push:
    branches: [master]
    paths:
      - 'vehicle/OVMS.V3/test/**'
      - 'vehicle/OVMS.V3/components/**/tests/**'
      - 'vehicle/OVMS.V3/components/**/src/**'
      - '.github/workflows/host-tests.yml'
  pull_request:
    paths:
      - 'vehicle/OVMS.V3/test/**'
      - 'vehicle/OVMS.V3/components/**/tests/**'
      - 'vehicle/OVMS.V3/components/**/src/**'
      - '.github/workflows/host-tests.yml'
  workflow_dispatch:

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodules: host tests mock the framework and don't link mongoose/
        # wolfssl/etc.

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make

      - name: Run host test suites
        run: |
          set -e
          shopt -s nullglob
          found=0
          for mk in vehicle/OVMS.V3/components/*/tests/Makefile; do
            dir="$(dirname "$mk")"
            echo "::group::$dir"
            make -C "$dir" clean
            make -C "$dir" test
            echo "::endgroup::"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No host test suites found (components/*/tests/Makefile)"; exit 1
          fi
